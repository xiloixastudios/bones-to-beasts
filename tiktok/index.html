<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok sign-in · Bones to Beasts</title><link rel="stylesheet" href="../style.css"></head><body>
<h1>TikTok sign-in</h1>
<p id="msg">This page is the return address for the Bones to Beasts posting tool.</p>
<p>If the tool asked you for it, copy this page's full address and paste it there:</p>
<p><code id="url"></code></p>
<script>
var q = new URLSearchParams(location.search);
document.getElementById('url').textContent = location.href;
if (q.get('code')) {
  document.getElementById('msg').textContent = 'Signed in with TikTok. The posting tool now needs the address below.';
} else if (q.get('error')) {
  document.getElementById('msg').textContent = 'TikTok reported an error: ' + (q.get('error_description') || q.get('error'));
}
</script>
<footer><a href="../">Back</a></footer>
</body></html>
